<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="JAFF logo">
  <title>JAFF</title>
  <defs>
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="20" y1="18" x2="72" y2="80">
      <stop offset="0" stop-color="#8b6cff"/>
      <stop offset=".55" stop-color="#e05fb0"/>
      <stop offset="1" stop-color="#ff6a5a"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="20" y1="55" x2="36" y2="71">
      <stop offset="0" stop-color="#ffc24b"/>
      <stop offset="1" stop-color="#ff6a5a"/>
    </linearGradient>
  </defs>

  <!-- directed reaction edges tracing the letter J -->
  <g stroke="url(#gA)" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".9">
    <line x1="34" y1="26" x2="67" y2="26"/>
    <line x1="67" y1="26" x2="59" y2="45"/>
    <line x1="59" y1="45" x2="59" y2="63"/>
    <line x1="59" y1="63" x2="45" y2="74"/>
    <line x1="45" y1="74" x2="28" y2="63"/>
  </g>

  <!-- field stars -->
  <circle cx="80" cy="16" r="1.4" fill="#8b6cff" opacity=".5"/>
  <circle cx="20" cy="40" r="1.1" fill="#e05fb0" opacity=".5"/>
  <circle cx="78" cy="72" r="1.6" fill="#ffc24b" opacity=".5"/>

  <!-- atom nodes -->
  <circle cx="34" cy="26" r="5"   fill="url(#gA)"/>
  <circle cx="67" cy="26" r="6"   fill="url(#gA)"/>
  <circle cx="59" cy="45" r="4"   fill="url(#gA)"/>
  <circle cx="59" cy="63" r="5"   fill="url(#gA)"/>
  <circle cx="45" cy="74" r="4"   fill="url(#gA)"/>

  <!-- product node accent -->
  <circle cx="28" cy="63" r="7.6" fill="url(#gB)"/>
  <circle cx="28" cy="63" r="7.6" fill="none" stroke="#ffc24b" stroke-width="1.4" opacity=".6"/>
</svg>
